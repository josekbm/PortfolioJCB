server {
    listen 80;
    server_name www.blancodev.es;
    return 301 https://blancodev.es$request_uri;
}

server {
    # Default server for unmatched Host headers (e.g. the Docker healthcheck
    # hitting 127.0.0.1). Without this, the www block above would answer with a
    # redirect instead of a 200.
    listen 80 default_server;
    server_name blancodev.es _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml text/xml image/svg+xml;

    include /etc/nginx/security-headers.conf;
    # Generated HTML, sitemap and robots are revalidated on every request.
    # Locations with their own add_header (assets, index.html, 404) override it.
    add_header Cache-Control "no-cache" always;

    error_page 404 /404.html;

    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }

    location = /es/index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }

    location ~ ^/site(\.es)?\.webmanifest$ {
        types {
            application/manifest+json webmanifest;
        }
        try_files $uri =404;
    }

    location / {
        # Every public URL is a real file or directory. Unknown paths return a
        # genuine 404 instead of the home page (no soft 404s).
        try_files $uri $uri/ =404;
    }
}
